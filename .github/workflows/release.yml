name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/PhotoVault-*.dmg dist/PhotoVault-*.zip dist/SHA256SUMS.txt \
            --title "PhotoVault ${GITHUB_REF_NAME#v}" \
            --notes "First release. Ad-hoc signed, not notarized: right-click the app and choose Open the first time. See the README and CHANGELOG.md."
