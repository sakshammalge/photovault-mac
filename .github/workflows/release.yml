name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        run: echo "TAG=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Package
        run: scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" \
            dist/PhotoVault-*.dmg dist/PhotoVault-*.zip dist/SHA256SUMS.txt \
            --title "PhotoVault ${TAG#v}" \
            --notes "First release. Ad-hoc signed, not notarized: right-click the app and choose Open the first time. See the README and CHANGELOG.md."
